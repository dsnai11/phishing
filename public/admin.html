<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Phishing Quiz – Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a4a;--teal:#0e8f86;--teal-l:#e3f4f2;--red:#c8372d;--red-l:#fdecea;--green:#1f8a4c;--green-l:#e6f5ec;
  --ink:#1d2733;--muted:#5d6b7a;--line:#dde3ea;--bg:#f4f6f9}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
header{background:var(--navy);color:#fff}
.in{max-width:1280px;margin:0 auto;padding:16px 22px}
header .in{display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0}
header small{opacity:.7;display:block;font-weight:400;font-size:12.5px}
header a{color:#7ee0d6;margin-left:auto;font-size:14px;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .v{font-size:28px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filters label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--teal)}
#search{width:240px}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pri{background:var(--teal);color:#fff}.sec{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.sec:hover{border-color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.right{margin-left:auto}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafbfc;position:sticky;top:0}
td.num{text-align:right}th.num{text-align:right}
tr:hover td{background:#fafcfd}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pass{background:var(--green-l);color:var(--green)}.mod{background:#eef1f5;color:var(--muted)}.mod.adv{background:#e8e6fb;color:#4b3fb0}.fail{background:var(--red-l);color:var(--red)}
.bar{display:inline-block;width:60px;height:6px;border-radius:9px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}
.del:hover{background:var(--red-l);color:var(--red)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.err{background:var(--red-l);color:var(--red);padding:12px;border-radius:8px;margin-bottom:12px;display:none}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}#search{width:100%}}
</style>
</head>
<body>
<header><div class="in">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7ee0d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
  <h1>Phishing Awareness — CISA-level Assessment Results<small>Admin dashboard</small></h1>
  <a href="/" target="_blank" rel="noopener">Open training ↗</a>
</div></header>

<div class="in">
  <div class="stats" id="stats">
    <div class="stat"><div class="v" id="sAttempts">–</div><div class="k">Total attempts</div></div>
    <div class="stat"><div class="v" id="sEmp">–</div><div class="k">Employees attempted</div></div>
    <div class="stat"><div class="v" id="sPassed">–</div><div class="k">Employees passed</div></div>
    <div class="stat"><div class="v" id="sAvg">–</div><div class="k">Average score</div></div>
    <div class="stat"><div class="v" id="s7">–</div><div class="k">Attempts, last 7 days</div></div>
  </div>

  <div class="panel">
    <div class="err" id="err"></div>
    <form class="filters" id="filters" onsubmit="event.preventDefault();state.page=1;load()">
      <label>Search (Employee ID, name, department)<input id="search" type="search" placeholder="e.g. EMP1024 or Priya"></label>
      <input type="hidden" id="module" value="advanced">
      <label>Show
        <select id="view">
          <option value="all">Every attempt</option>
          <option value="latest">Latest attempt per employee</option>
          <option value="best">Best attempt per employee</option>
        </select></label>
      <label>Result
        <select id="status"><option value="">All</option><option value="passed">Passed</option><option value="failed">Failed</option></select></label>
      <label>From<input id="from" type="date"></label>
      <label>To<input id="to" type="date"></label>
      <button class="btn pri" type="submit">Apply</button>
      <button class="btn sec" type="button" onclick="resetFilters()">Reset</button>
      <a class="btn sec right" id="csv" href="#">⬇ Download CSV</a>
    </form>
    <div class="tbl">
      <table>
        <thead><tr>
          <th>Submitted (IST)</th><th>Employee ID</th><th>Name</th><th>Department</th><th>Lang</th>
          <th class="num">Score</th><th class="num">Correct</th><th>Result</th><th class="num">Attempt #</th><th class="num">Time</th><th></th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="11" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <span id="pinfo"></span>
      <button class="btn sec" id="prev" onclick="state.page--;load()">← Prev</button>
      <button class="btn sec" id="next" onclick="state.page++;load()">Next →</button>
    </div>
  </div>
</div>

<script>
const state = { page: 1, limit: 50 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (d) => new Date(d).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

function params(withPage) {
  const p = new URLSearchParams();
  ["module", "search", "view", "status", "from", "to"].forEach((k) => { const v = $(k).value.trim(); if (v) p.set(k, v); });
  if (withPage) { p.set("page", state.page); p.set("limit", state.limit); }
  return p;
}
function showErr(m) { const e = $("err"); e.textContent = m; e.style.display = m ? "block" : "none"; }

async function loadStats() {
  try {
    const m = $("module").value;
    const r = await fetch("/api/admin/stats" + (m ? "?module=" + m : ""), { credentials: "same-origin" });
    if (!r.ok) throw new Error("stats " + r.status);
    const s = await r.json();
    $("sAttempts").textContent = s.total_attempts.toLocaleString("en-IN");
    $("sEmp").textContent = s.employees.toLocaleString("en-IN");
    $("sPassed").textContent = s.employees_passed.toLocaleString("en-IN") + (s.employees ? ` (${Math.round(s.employees_passed / s.employees * 100)}%)` : "");
    $("sAvg").textContent = s.avg_score + "%";
    $("s7").textContent = s.last_7_days.toLocaleString("en-IN");
  } catch (e) { showErr("Could not load summary: " + e.message); }
}

async function load() {
  showErr("");
  $("csv").href = "/api/admin/results.csv?" + params(false).toString();
  try {
    const r = await fetch("/api/admin/results?" + params(true).toString(), { credentials: "same-origin" });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
    const d = await r.json();
    const pages = Math.max(1, Math.ceil(d.total / d.limit));
    if (state.page > pages) { state.page = pages; return load(); }
    $("rows").innerHTML = d.rows.length ? d.rows.map((x) => {
      const col = x.passed ? "var(--green)" : "var(--red)";
      return `<tr>
        <td>${fmt(x.created_at)}</td>
        <td><b>${esc(x.emp_id)}</b></td>
        <td>${esc(x.full_name)}</td>
        <td>${esc(x.department || "—")}</td>
        <td>${x.language === "hi" ? "हिंदी" : "EN"}</td>
        <td class="num"><b>${x.score}%</b><span class="bar"><i style="width:${x.score}%;background:${col}"></i></span></td>
        <td class="num">${x.correct_count}/${x.total_questions}</td>
        <td><span class="pill ${x.passed ? "pass" : "fail"}">${x.passed ? "PASSED" : "FAILED"}</span></td>
        <td class="num">${x.attempt_no}</td>
        <td class="num">${x.duration_sec == null ? "—" : Math.max(1, Math.round(x.duration_sec / 60)) + " min"}</td>
        <td><button class="del" title="Delete this attempt" onclick="delRow(${x.id}, '${esc(x.emp_id)}')">🗑</button></td>
      </tr>`;
    }).join("") : `<tr><td colspan="11" class="empty">No results match these filters yet.</td></tr>`;
    $("pinfo").textContent = `${d.total.toLocaleString("en-IN")} record(s) · page ${state.page} of ${pages}`;
    $("prev").disabled = state.page <= 1;
    $("next").disabled = state.page >= pages;
  } catch (e) {
    $("rows").innerHTML = `<tr><td colspan="11" class="empty">Could not load results.</td></tr>`;
    showErr("Could not load results: " + e.message);
  }
}

async function delRow(id, emp) {
  if (!confirm(`Delete attempt #${id} for ${emp}? This cannot be undone.`)) return;
  const r = await fetch("/api/admin/results/" + id, { method: "DELETE", credentials: "same-origin" });
  if (!r.ok) return showErr("Delete failed.");
  loadStats(); load();
}
function resetFilters() { $("filters").reset(); state.page = 1; loadStats(); load(); }

loadStats(); load();
</script>
</body>
</html>
