<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Awareness – Advanced Assessment | फ़िशिंग जागरूकता – उन्नत मूल्यांकन</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a4a;--navy2:#173a63;--teal:#0e8f86;--teal-l:#e3f4f2;
  --red:#c8372d;--red-l:#fdecea;--amber:#b7791f;--amber-l:#fff6e0;
  --green:#1f8a4c;--green-l:#e6f5ec;--ink:#1d2733;--muted:#5d6b7a;
  --line:#dde3ea;--bg:#f4f6f9;--card:#fff;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px}
body.hi{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif;font-size:16.5px;line-height:1.75}
button{font-family:inherit;font-size:inherit;cursor:pointer}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--teal);display:grid;place-items:center;flex:none}
.top h1{font-size:17px;margin:0;font-weight:700;line-height:1.25}
.top small{display:block;opacity:.75;font-weight:400;font-size:12.5px}
.spacer{flex:1}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.lang button.on{background:#fff;color:var(--navy)}
.progress{height:5px;background:rgba(255,255,255,.15)}
.progress i{display:block;height:100%;background:#4fd1c5;width:0;transition:width .4s}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px 20px 60px}
nav.side{position:sticky;top:90px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
nav.side button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--ink);font-size:14.5px;line-height:1.35}
nav.side button:hover{background:var(--bg)}
nav.side button.cur{background:var(--teal-l);color:var(--navy);font-weight:600}
nav.side .num{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
nav.side button.done .num{background:var(--teal);border-color:var(--teal);color:#fff}
nav.side button.cur .num{border-color:var(--teal);color:var(--teal)}
nav.side button.done.cur .num{color:#fff}
main{min-width:0}main:focus{outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;margin-bottom:20px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
body.hi .eyebrow{letter-spacing:0}
h2{font-size:28px;line-height:1.25;margin:6px 0 10px;color:var(--navy)}
h3{font-size:19px;margin:22px 0 8px;color:var(--navy)}
p{margin:0 0 12px}
.lead{font-size:17.5px;color:#34404d}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.hero h2{color:#fff;font-size:32px}
.hero .lead{color:#d7e3f0}
.hero .eyebrow{color:#7ee0d6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:13.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.tile{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.tile b{display:block;color:var(--navy);margin-bottom:4px}
.tile .ic{font-size:26px;line-height:1;margin-bottom:8px}
.callout{border-radius:12px;padding:14px 16px;margin:14px 0;display:flex;gap:12px;align-items:flex-start}
.callout .ic{font-size:22px;line-height:1.2}
.c-red{background:var(--red-l);border-left:4px solid var(--red)}
.c-teal{background:var(--teal-l);border-left:4px solid var(--teal)}
.c-amber{background:var(--amber-l);border-left:4px solid var(--amber)}
.flip{perspective:900px;min-height:170px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.front{background:#fff;border:1px solid var(--line);text-align:center;align-items:center}
.front .ic{font-size:34px}
.front b{color:var(--navy);margin-top:6px}
.front small{color:var(--muted);font-size:12.5px;margin-top:4px}
.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:14.5px;line-height:1.5}
.back b{color:#7ee0d6;display:block;margin-bottom:4px}
/* email mock */
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0;font-family:Inter,"Noto Sans Devanagari",sans-serif}
.mail-bar{background:#eef1f5;padding:8px 14px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mail-bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mail-h{padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.mail-h div{margin:3px 0}
.mail-h span.k{color:var(--muted);display:inline-block;min-width:68px}
.mail-b{padding:18px;font-size:15px}
.hs{background:transparent;border:0;padding:1px 3px;border-radius:4px;color:inherit;text-align:left;border-bottom:2px dashed transparent;transition:.15s}
.hunt .hs{border-bottom-color:#c9d3de}
.hunt .hs:hover{background:var(--amber-l);border-bottom-color:var(--amber)}
.hs.found{background:var(--red-l);border-bottom:2px solid var(--red)!important;color:var(--red);font-weight:600}
.fakebtn{display:inline-block;background:#1a73e8;color:#fff!important;padding:8px 18px;border-radius:6px;font-weight:600;margin:6px 0}
.hs.fakebtn.found{background:var(--red);color:#fff!important}
.attach{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:6px}
.found-list{list-style:none;padding:0;margin:10px 0 0}
.found-list li{background:var(--red-l);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14.5px;animation:pop .3s}
.found-list li b{color:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.counter{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
/* scenario */
.scn{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff}
.scn-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.badge{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.msg{border-radius:12px;padding:14px 16px;font-size:15px;margin-bottom:14px;white-space:pre-line}
.msg.sms{background:#e9edf2;border-radius:16px 16px 16px 4px;max-width:520px}
.msg.wa{background:#dcf8c6;border-radius:16px 16px 16px 4px;max-width:520px}
.msg.email{background:#fff;border:1px solid var(--line)}
.msg.call{background:var(--navy);color:#fff}
.msg.poster{background:#fffbe6;border:2px dashed #e0b400;text-align:center}
.msg .meta{display:block;font-size:12.5px;opacity:.7;margin-bottom:4px;white-space:normal}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:600;font-size:15px;transition:.15s}
.btn-phish{background:var(--red);color:#fff}.btn-phish:hover{filter:brightness(1.08)}
.btn-legit{background:var(--green);color:#fff}.btn-legit:hover{filter:brightness(1.08)}
.btn-pri{background:var(--teal);color:#fff}.btn-pri:hover{filter:brightness(1.08)}
.btn-sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-sec:hover{border-color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;animation:pop .3s}
.fb.ok{background:var(--green-l);border-left:4px solid var(--green)}
.fb.no{background:var(--red-l);border-left:4px solid var(--red)}
.fb b.t{display:block;margin-bottom:4px}
.fb ul{margin:6px 0 0;padding-left:20px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{outline:2px solid var(--navy);outline-offset:1px}
/* url */
.url-anat{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:#0f1b2b;color:#cfe0f5;padding:16px;border-radius:12px;overflow-x:auto;white-space:nowrap}
.url-anat .p{color:#8aa0b8}.url-anat .s{color:#ffd479}.url-anat .d{color:#5ef0c0;font-weight:700;text-decoration:underline}.url-anat .x{color:#c49cff}
.url-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;margin:10px 0 4px}
.url-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;background:var(--c)}
.url-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;word-break:break-all}
.url-opt:hover{border-color:var(--navy)}
.url-opt.ok{border-color:var(--green);background:var(--green-l)}
.url-opt.no{border-color:var(--red);background:var(--red-l)}
.url-opt small{display:block;font-family:Inter,"Noto Sans Devanagari",sans-serif;font-size:13.5px;margin-top:4px;color:var(--ink)}
/* steps */
.steps{counter-reset:s;display:grid;gap:12px;margin-top:10px}
.step{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.step .n{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.step b{display:block;color:var(--navy)}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc>button{width:100%;text-align:left;border:0;background:#fff;padding:14px 16px;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.acc>button::after{content:"+";font-size:22px;color:var(--teal);line-height:1}
.acc.open>button::after{content:"–"}
.acc .ab{display:none;padding:0 16px 14px}
.acc.open .ab{display:block}
.acc ol,.acc ul{margin:0;padding-left:22px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;background:#fff;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--teal);flex:none}
.check.on{background:var(--teal-l);border-color:var(--teal)}
/* quiz */
.q-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:15.5px;color:var(--ink)}
.q-opt:hover:not(:disabled){border-color:var(--navy)}
.q-opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.q-opt.ok{border-color:var(--green);background:var(--green-l)}
.q-opt.ok .l{background:var(--green);color:#fff}
.q-opt.no{border-color:var(--red);background:var(--red-l)}
.q-opt.no .l{background:var(--red);color:#fff}
.q-opt:disabled{cursor:default}
.qbar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 20px}
.qbar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.score-ring{width:150px;height:150px;margin:10px auto}
.cert{border:3px double var(--navy);border-radius:16px;padding:34px;text-align:center;background:linear-gradient(#fff,#f7fbfb);margin-top:18px}
.cert h3{font-size:24px;margin:6px 0}
.cert .nm{font-size:26px;font-weight:800;color:var(--teal);border-bottom:2px solid var(--line);display:inline-block;padding:0 20px 4px;margin:10px 0}
input[type=text]{font-family:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;width:100%;max-width:360px}
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.muted{color:var(--muted)}
.center{text-align:center}
.mt{margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
/* proctoring */
body.proctoring nav.side{display:none}
body.proctoring .wrap{grid-template-columns:1fr;max-width:920px}
body.proctoring main{user-select:none;-webkit-user-select:none}
body.proc-locked main{filter:blur(10px);pointer-events:none}
#proc-overlay{position:fixed;inset:0;background:rgba(15,42,74,.82);z-index:100;display:grid;place-items:center;padding:20px}
#proc-overlay[hidden]{display:none}
.pov-card{background:#fff;border-radius:16px;padding:28px 30px;max-width:500px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s}
.pov-card.warn{border-top:6px solid var(--red)}
.pov-card h3{margin:6px 0 10px;color:var(--red);font-size:22px}
.pov-ic{font-size:42px;line-height:1.1}
.pov-strong{font-weight:700;color:var(--navy)}
#proc-timer{position:fixed;top:74px;right:20px;z-index:30;background:var(--navy);color:#fff;border-radius:999px;padding:8px 16px;font-size:14.5px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center}
#proc-timer[hidden]{display:none}
#proc-timer.low{background:var(--red)}
.q-opt.sel{border-color:var(--navy);background:#eef3fa;box-shadow:inset 0 0 0 1px var(--navy)}
.q-opt.sel .l{background:var(--navy);color:#fff}
.qnav{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.qnav .muted{font-size:13.5px}
#cam-box{position:fixed;right:16px;bottom:16px;z-index:40;width:200px;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 6px 20px rgba(0,0,0,.3);border:2px solid #fff}
#cam-box[hidden]{display:none}
body.cam-on .wrap{padding-bottom:200px}
#cam-box video{display:block;width:100%;height:auto;transform:scaleX(-1)}
#cam-status{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#7ee0a0;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
#cam-status.bad{color:#ff8a80}
.camcheck{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;background:#fafcfd}
.camcheck .btn{margin-top:6px}
.extok{color:var(--green);font-weight:600;margin:0 0 12px}
#extcheck ul{margin:6px 0 10px}
@media (max-width:600px){#cam-box{width:120px;right:10px;bottom:64px}}
#proc-timer .pt-w{background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px;font-size:13px}
.rules{padding-left:22px;margin:12px 0 18px}.rules li{margin-bottom:9px}
.endbanner{text-align:left;margin:4px 0 10px}
@media (max-width:600px){#proc-timer{top:auto;bottom:16px;right:50%;transform:translateX(50%)}}

.cert-logo{display:block;height:84px;width:auto;margin:0 auto 10px}
.cert-org{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--navy);margin-bottom:4px}
.badge.dom{display:inline-block;background:var(--teal-l);color:var(--navy);margin:-2px 0 6px}
.idform{display:grid;gap:14px;max-width:460px;margin-top:16px}
.idform label{display:grid;gap:6px;font-weight:600;font-size:14.5px;color:var(--navy)}
.idform input{max-width:none;font-weight:400}
.idform input:focus,input[type=text]:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.idpill{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border-radius:999px;padding:6px 14px;font-size:13.5px;margin-top:8px;color:var(--muted)}
.idpill b{color:var(--navy)}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:600;text-decoration:underline;padding:0 0 0 4px;font-size:13.5px}
.savebar{display:inline-block;border-radius:12px;padding:10px 16px;margin:6px auto;font-size:14.5px;max-width:560px}
.savebar.saving{background:var(--amber-l)}.savebar.ok{background:var(--green-l);color:var(--green)}.savebar.err{background:var(--red-l);color:var(--red)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:static;display:flex;overflow-x:auto;gap:4px}
  nav.side button{flex:none;width:auto;white-space:nowrap}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .g2,.g3{grid-template-columns:1fr}
  .card{padding:20px 18px}
  h2{font-size:23px}.hero h2{font-size:26px}
  .top h1{font-size:15px}
}
@media print{
  header.top,nav.side,.navbtns,.noprint{display:none!important}
  .wrap{display:block;padding:0}
  .card{border:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <h1 id="tTitle">Phishing Awareness<small id="tSub">Cyber Security Training</small></h1>
    <div class="spacer"></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="bEn" class="on" onclick="setLang('en')">English</button>
      <button id="bHi" onclick="setLang('hi')">हिंदी</button>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Lessons"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast"></div>
<div id="proc-overlay" hidden></div>
<div id="proc-timer" hidden></div>
<div id="cam-box" hidden><video id="cam-video" muted playsinline autoplay></video><span id="cam-status"></span></div>

<script>
/* =========================================================
   EDIT HERE: organisation-specific settings
   ========================================================= */
const CONFIG = {
  orgName: { en: "our organisation", hi: "हमारी संस्था" },
  reportTo: {
    en: "the IT / Information Security team (use the 'Report Phishing' button in Outlook, or email your IT helpdesk)",
    hi: "IT / सूचना सुरक्षा टीम (Outlook में 'Report Phishing' बटन का उपयोग करें, या IT हेल्पडेस्क को ईमेल करें)"
  },
  passMark: 80,
  // Where quiz results are sent. Leave "" when this page is served by the Render app itself.
  // If you upload this page to an LMS instead, put your Render URL here, e.g. "https://phishing-quiz.onrender.com",
  // and add the LMS website address to ALLOWED_ORIGINS on Render.
  apiBase: "",
  saveResults: true,
  // Proctoring
  camera: true,          // webcam required: face checks + photos
  record: true,          // record camera video + microphone sound for the whole test (needs a microphone)
  timeLimitMin: 30,      // 0 = no time limit
  maxWarnings: 2,        // warnings before the assessment is ended (3rd rule break ends it)
  shuffle: true,         // random order of questions and answer options
  serverPaper: true,     // questions come from the server; correct answers are never shown to the learner (score only)
  uniquePaper: true,     // a different, unique paper (rotated from 5 question sets) on every attempt
  moduleId: "advanced"
};

/* =========================================================
   CONTENT (English + Hindi)
   ========================================================= */

async function camTick(){

/* --- full video + sound recording (advanced module: CONFIG.record) --- */
// The browser records the camera and microphone and sends a piece every 5 seconds; the server keeps them in Neon.
function startRecording(){
  if(!REC || !CAM.live || !CAM.stream || CAM.rec || !st.proc.sid || typeof MediaRecorder === "undefined") {
    if(REC && procActive() && typeof MediaRecorder === "undefined") pEvent("recording_failed", false, "browser cannot record");
    return;
  }
  const types = ["video/webm;codecs=vp8,opus", "video/webm;codecs=vp9,opus", "video/webm", "video/mp4"];
  const mime = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  let rec;
  try{ rec = new MediaRecorder(CAM.stream, Object.assign({videoBitsPerSecond:90000, audioBitsPerSecond:24000}, mime ? {mimeType:mime} : {})); }
  catch(e){ pEvent("recording_failed", false, String(e && e.name || e)); return; }
  st.proc.recPart = (st.proc.recPart ?? -1) + 1;
  const part = st.proc.recPart, sid = st.proc.sid; let seq = 0;
  CAM.rec = rec; CAM.recMime = rec.mimeType || mime;
  rec.addEventListener("dataavailable", e => { if(e.data && e.data.size){ CAM.recQueue.push({sid, part, seq:seq++, blob:e.data, mime:CAM.recMime, tries:0}); pumpUploads(); } });
  rec.addEventListener("stop", () => { if(CAM.rec === rec) CAM.rec = null; updateCam(); });
  rec.addEventListener("error", e => pEvent("recording_failed", false, String(e && e.error && e.error.name || "error")));
  rec.start(5000);
  pEvent("recording_start", false, "part " + (part+1)); persist(); updateCam();
}
async function pumpUploads(){
  if(CAM.recUploading) return; CAM.recUploading = true;
  while(CAM.recQueue.length){
    const c = CAM.recQueue[0];
    try{
      const r = await fetch(apiUrl(`/api/session/${c.sid}/recording?part=${c.part}&seq=${c.seq}&mime=${encodeURIComponent(c.mime||"")}`),
        {method:"POST", headers:{"Content-Type":"application/octet-stream"}, body:c.blob, keepalive: c.blob.size < 60000});
      if(!r.ok) throw new Error("HTTP " + r.status);

      if(c.tries > 20){ CAM.recQueue.shift(); pEvent("recording_gap", false, "piece " + c.seq + " of part " + (c.part+1)); }
      else await new Promise(res => setTimeout(res, 3000));

  }

}
function stopRecording(){
  return new Promise(res => {
    const rec = CAM.rec; if(!rec || rec.state === "inactive"){ CAM.rec = null; return res(); }
    const t = setTimeout(res, 2500);

/* --- browser extension detection (a web page cannot block extensions, but it can see the ones that change it) --- */

  const cls = (typeof el.className === "string" && el.className.trim()) ? "." + el.className.trim().split(/\s+/)[0] : "";
  return "Extension element <" + (t + (el.id ? "#"+el.id : "") + cls).slice(0,60) + ">";

function scanExtensions(){

  });

function saveBanner(){
  if(!CONFIG.saveResults) return "";
  const s = st.save;
  if(s.status==="saving") return `<div class="savebar saving">⏳ ${T("saving")}</div>`;
  if(s.status==="ok") return `<div class="savebar ok">✔ ${T("saved")} <span class="muted">(${T("empLbl")} ${esc(st.emp.empId)} · ${T("attempt")} #${s.data&&s.data.attemptNo||1})</span></div>`;
  if(s.status==="err") return `<div class="savebar err" role="alert">⚠ ${T("saveErr")}<br><small class="muted">${esc(s.data&&s.data.error)}</small><br>
    <button class="btn btn-pri" style="margin-top:8px" onclick="saveResult()">↻ ${T("retrySave")}</button></div>`;
  return "";
}
function doPrint(){ try{ window.print(); }catch(e){ toast(T("printFail")); } }

function render(){
  renderSide();
  $("#main").innerHTML = V[cur]();
  showOverlay(); tickTimer(); updateCam();
}

/* boot */

SCORM.init();
restoreProc();
try{ BC && BC.postMessage({t:"hello"}); }catch(e){}
window.addEventListener("beforeunload", ()=>{ SCORM.commit(); SCORM.finish(); });
setLang(lang);
