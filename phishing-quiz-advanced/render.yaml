# Render Blueprint: creates the web app. The database is on Neon (https://neon.tech).
# In Render: New + → Blueprint → select the GitHub repo that contains this file.
services:
  - type: web
    name: phishing-quiz-advanced
    runtime: node
    plan: free                  # change to "starter" to avoid the free-tier sleep (~1 min wake-up)
    region: singapore           # closest Render region to India; pick a Neon region near it too
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false             # paste your Neon connection string when Render asks
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false             # Render will ask you to type this in
      - key: PASS_MARK
        value: "80"
      - key: ALLOWED_ORIGINS
        sync: false             # optional: your LMS website address, if you upload the page to the LMS
